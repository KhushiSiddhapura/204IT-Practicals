<!doctype html>
<html>
  <body>
    <h2>Registration Form</h2>

    <form id="myForm" onsubmit="return submitForm(event);">
      Username:
      <input type="text" id="username" onblur="check(this)" />
      <span id="usernameMsg"></span>
      <br /><br />

      Password:
      <input type="password" id="password" onblur="check(this)" />
      <span id="passwordMsg"></span>
      <br /><br />

      Confirm Password:
      <input type="password" id="confirm" onblur="check(this)" />
      <span id="confirmMsg"></span>
      <br /><br />

      Email:
      <input type="text" id="email" onblur="check(this)" />
      <span id="emailMsg"></span>
      <br /><br />

      Mobile:
      <input type="text" id="mobile" onblur="check(this)" />
      <span id="mobileMsg"></span>
      <br /><br />

      <button type="submit" id="submitBtn" disabled>Submit</button>
    </form>

    <br />

    <div id="result"></div>

    <script>
      var valid = {
        username: false,
        password: false,
        confirm: false,
        email: false,
        mobile: false,
      };

      function check(input) {
        var field = input.id;

        var xhr = new XMLHttpRequest();

        xhr.open(
          "GET",
          "validate.php?field=" +
            field +
            "&value=" +
            input.value +
            "&password=" +
            document.getElementById("password").value,
        );

        xhr.onreadystatechange = function () {
          if (xhr.readyState == 4 && xhr.status == 200) {
            document.getElementById(field + "Msg").innerHTML = xhr.responseText;

            valid[field] = xhr.responseText.includes("VALID:");
            document.getElementById(field + "Msg").innerHTML =
              xhr.responseText.replace("VALID:", "");

            checkAll();
          }
        };

        xhr.send();
      }

      function checkAll() {
        var allValid = true;

        for (var field in valid) {
          if (!valid[field]) {
            allValid = false;
          }
        }

        document.getElementById("submitBtn").disabled = !allValid;
      }

      function submitForm(event) {
        event.preventDefault();

        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var email = document.getElementById("email").value;
        var mobile = document.getElementById("mobile").value;

        document.getElementById("result").innerHTML =
          "<h2>Submitted Information</h2>" +
          "<table border='1' cellpadding='10'>" +
          "<tr><th>Field</th><th>Value</th></tr>" +
          "<tr><td>Username</td><td>" +
          username +
          "</td></tr>" +
          "<tr><td>Password</td><td>********</td></tr>" +
          "<tr><td>Email</td><td>" +
          email +
          "</td></tr>" +
          "<tr><td>Mobile</td><td>" +
          mobile +
          "</td></tr>" +
          "</table>";

        return false;
      }
    </script>
  </body>
</html>
